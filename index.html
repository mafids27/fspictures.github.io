  <script>
    (function() {
      window.__fsUserMuted = false;
      window.__fsAudioStarted = false;

      window.__fsTryAutoPlay = function() {
        if (window.__fsUserMuted || window.__fsAudioStarted) return;
        var audio = document.getElementById('fs-bgm-audio');
        if (!audio) return;
        audio.volume = 0.4;
        if (audio.paused) {
          var playPromise = audio.play();
          if (playPromise !== undefined) {
            playPromise.then(function() {
              window.__fsAudioStarted = true;
              window.dispatchEvent(new Event('fs-audio-started'));
            }).catch(function() {});
          }
        } else {
          window.__fsAudioStarted = true;
          window.dispatchEvent(new Event('fs-audio-started'));
        }
      };

      window.addEventListener('DOMContentLoaded', function() {
        var audio = document.getElementById('fs-bgm-audio');
        if (audio) audio.load();
        window.__fsTryAutoPlay();
      });
      window.addEventListener('load', window.__fsTryAutoPlay);

      ['touchstart', 'touchend', 'pointerdown', 'mousedown', 'click', 'keydown'].forEach(function(evt) {
        document.addEventListener(evt, window.__fsTryAutoPlay, true);
        window.addEventListener(evt, window.__fsTryAutoPlay, true);
      });
    })();
  </script>

    // Format YYYY-MM-DD kepada "15 February 2027"
    const formatReadableDate = (isoDate) => {
      if (!isoDate) return '';
      const parts = isoDate.split('-');
      if (parts.length !== 3) return isoDate;
      const [year, month, day] = parts;
      const monthObj = MONTHS_LIST.find(m => m.value === month);
      return `${parseInt(day, 10)} ${monthObj ? monthObj.label : month} ${year}`;
    };

    // Normalisasi pelbagai format tarikh dari Google Sheets CSV kepada YYYY-MM-DD
    const normalizeSheetDate = (raw) => {
      if (!raw) return null;
      const clean = String(raw).replace(/^["']|["']$/g, '').trim();
      if (!clean) return null;

      // 1. Format ISO YYYY-MM-DD
      const isoMatch = clean.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
      if (isoMatch) {
        return `${isoMatch[1]}-${isoMatch[2].padStart(2, '0')}-${isoMatch[3].padStart(2, '0')}`;
      }

      // 2. Format DD/MM/YYYY atau D-M-YYYY
      const dmyMatch = clean.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);
      if (dmyMatch) {
        const part1 = parseInt(dmyMatch[1], 10);
        const part2 = parseInt(dmyMatch[2], 10);
        const year = dmyMatch[3];
        if (part2 > 12 && part1 <= 12) {
          return `${year}-${String(part1).padStart(2, '0')}-${String(part2).padStart(2, '0')}`;
        }
        return `${year}-${String(part2).padStart(2, '0')}-${String(part1).padStart(2, '0')}`;
      }

      // 3. Format Teks "2 Jan 2026" atau "2 January 2026"
      const monthMap = {
        jan: '01', january: '01',
        feb: '02', february: '02',
        mar: '03', march: '03',
        apr: '04', april: '04',
        may: '05',
        jun: '06', june: '06',
        jul: '07', july: '07',
        aug: '08', august: '08',
        sep: '09', sept: '09', september: '09',
        oct: '10', october: '10',
        nov: '11', november: '11',
        dec: '12', december: '12'
      };
      const textMatch = clean.match(/^(\d{1,2})[\s-]+([a-zA-Z]+)[\s,-]+(\d{4})$/);
      if (textMatch) {
        const d = textMatch[1].padStart(2, '0');
        const mKey = textMatch[2].toLowerCase();
        const m = monthMap[mKey];
        const y = textMatch[3];
        if (m) return `${y}-${m}-${d}`;
      }

      return null;
    };

      const [bookedDates, setBookedDates] = useState(DEFAULT_BOOKED_DATES);

      const [selectedWeddingPkg, setSelectedWeddingPkg] = useState('nikah_sanding_single_799');

      const [eventDate, setEventDate] = useState('');
      const [eventDate2, setEventDate2] = useState('');
      const [eventLocation, setEventLocation] = useState('');

      const [clientPhone, setClientPhone] = useState('');
      const [clientInstagram, setClientInstagram] = useState('');
      const [agreedToTnC, setAgreedToTnC] = useState(false);
      const [clientFormError, setClientFormError] = useState('');

      const summaryRef = React.useRef(null);

      // Muat turun tarikh booked terus dari Google Sheets CSV
      useEffect(() => {
        if (!GOOGLE_SHEETS_CSV_URL) return;
        fetch(GOOGLE_SHEETS_CSV_URL)
          .then(res => res.text())
          .then(csvText => {
            const lines = csvText.split(/\r?\n/);
            const parsedDates = [];
            lines.forEach(line => {
              const firstCol = line.split(',')[0];
              const normalized = normalizeSheetDate(firstCol);
              if (normalized) parsedDates.push(normalized);
            });
            setBookedDates(Array.from(new Set(parsedDates)));
          })
          .catch(() => {});
      }, []);

      // Segerakkan status muzik latar belakang
      useEffect(() => {
        const audio = document.getElementById('fs-bgm-audio');
        if (audio && !audio.paused) {
          setIsMusicPlaying(true);
        }
        const onStarted = () => setIsMusicPlaying(true);
        window.addEventListener('fs-audio-started', onStarted);
        return () => window.removeEventListener('fs-audio-started', onStarted);
      }, []);

      const toggleBackgroundMusic = () => {
        const audio = document.getElementById('fs-bgm-audio');
        if (!audio) return;
        if (isMusicPlaying) {
          audio.pause();
          window.__fsUserMuted = true;
          setIsMusicPlaying(false);
        } else {
          window.__fsUserMuted = false;
          audio.volume = 0.4;
          audio.play().then(() => {
            window.__fsAudioStarted = true;
            setIsMusicPlaying(true);
          }).catch(() => {});
        }
      };

      const isSeparateDaysPkg = useMemo(() => {
        return selectedWeddingPkg === 'nikah_sanding_sep_899' || selectedWeddingPkg === 'exc_sep_1699';
      }, [selectedWeddingPkg]);

      const handleSelectPackage = (pkgId) => {
        setSelectedWeddingPkg(pkgId);
        const isSep = pkgId === 'nikah_sanding_sep_899' || pkgId === 'exc_sep_1699';
        if (isSep) {
          setTripDays(2);
        } else {
          setTripDays(1);
          setSelectedWeddingAddons(prev => prev.filter(item => item !== 'outdoor2_498'));
        }
      };

      const toggleAddon = (id) => {
        setSelectedWeddingAddons(prev => {
          if (prev.includes(id)) {
            return prev.filter(item => item !== id);
          }
          let next = [...prev, id];
          if (id === 'outdoor_249') {
            next = next.filter(item => item !== 'outdoor2_498');
          } else if (id === 'outdoor2_498') {
            next = next.filter(item => item !== 'outdoor_249');
          }
          return next;
        });
      };

      const resetAll = () => {
        setSelectedWeddingPkg('nikah_sanding_single_799');
        setSelectedWeddingAddons([]);
        setWeddingOvertimeHours(0);
        setSelectedLocation('tr_30');
        setTripDays(1);
        setEventDate('');
        setEventDate2('');
        setEventLocation('');
        setEventLocation2('');
        setClientName('');
        setClientPhone('');
        setClientInstagram('');
        setAgreedToTnC(false);
        setClientFormError('');
        setAvailabilityResult(null);
      };

      const updateDatePart = (currentIso, part, value, setter) => {
        const parts = currentIso ? currentIso.split('-') : ['2027', '01', '01'];
        let [y, m, d] = parts.length === 3 ? parts : ['2027', '01', '01'];
        if (part === 'year') y = value;
        if (part === 'month') m = value;
        if (part === 'day') d = value;
        setter(`${y}-${m}-${d}`);
        setAvailabilityResult(null);
        setAgreedToTnC(false);
      };

      const handleCheckAvailability = () => {
        if (!eventDate || !eventLocation.trim() || (isSeparateDaysPkg && (!eventDate2 || !eventLocation2.trim()))) {
          setAvailabilityResult({
            status: 'missing',
            message: 'Please fill in both your Event Date and Event Location in Section 4 before checking availability.'
          });
          return;
        }

        const isDate1Booked = bookedDates.includes(eventDate);
        const isDate2Booked = isSeparateDaysPkg && eventDate2 ? bookedDates.includes(eventDate2) : false;

        if (isDate1Booked || isDate2Booked) {
          const clashedDate = isDate1Booked ? formatReadableDate(eventDate) : formatReadableDate(eventDate2);
          setAvailabilityResult({
            status: 'booked',
            message: `Sorry, the date ${clashedDate} is already booked in FS Pictures' calendar. Please choose another date.`
          });
          setAgreedToTnC(false);
        } else {
          const formattedD1 = formatReadableDate(eventDate);
          const formattedD2 = isSeparateDaysPkg && eventDate2 ? ` & ${formatReadableDate(eventDate2)}` : '';
          setAvailabilityResult({
            status: 'available',
            message: `Good news! Your selected date (${formattedD1}${formattedD2}) is AVAILABLE.`
          });
        }
      };

      const calculation = useMemo(() => {
        const basePkg = PRICING_DATA.weddingPackages.find(p => p.id === selectedWeddingPkg) || PRICING_DATA.weddingPackages[0];
        const basePrice = basePkg.price;
        const addonsList = PRICING_DATA.weddingAddons.filter(a => selectedWeddingAddons.includes(a.id));
        const overtimeHours = weddingOvertimeHours;
        const overtimeRate = PRICING_DATA.weddingOvertimeRate;

        const addonsTotal = addonsList.reduce((sum, item) => sum + item.price, 0);
        const overtimeTotal = overtimeHours * overtimeRate;
        const locationObj = PRICING_DATA.locations.find(l => l.id === selectedLocation) || PRICING_DATA.locations[0];
        const locationUnitRate = locationObj.price;
        const locationDiscount = (locationUnitRate > 0 && tripDays >= 2) ? 10 : 0;
        const locationCharge = locationUnitRate === 0 ? 0 : (locationUnitRate * tripDays) - locationDiscount;

        const grandTotal = basePrice + addonsTotal + overtimeTotal + locationCharge;

        return {
          basePkg,
          basePrice,
          addonsList,
          addonsTotal,
          overtimeHours,
          overtimeRate,
          overtimeTotal,
          locationObj,
          locationUnitRate,
          tripDays,
          locationDiscount,
          locationCharge,
          grandTotal
        };
      }, [selectedWeddingPkg, selectedWeddingAddons, weddingOvertimeHours, selectedLocation, tripDays]);

      const formatRM = (num) => {
        return new Intl.NumberFormat('ms-MY', {
          minimumFractionDigits: 0,

      const generateWhatsAppText = () => {
        const pkgTitle = `${calculation.basePkg.name} (${calculation.basePkg.duration})`;

        text += `_by Firdaus Shah - Wedding Investment_\n`;
        text += `----------------------------------------\n`;
        if (clientName.trim() || clientPhone.trim() || clientInstagram.trim()) {
          text += `*CLIENT DETAILS:*\n`;
          if (clientName.trim()) text += `Name: ${clientName.trim()}\n`;
          if (clientPhone.trim()) text += `Phone: ${clientPhone.trim()}\n`;
          if (clientInstagram.trim()) text += `Instagram: ${clientInstagram.trim()}\n`;

        if (isSeparateDaysPkg) {

                                    <span className="text-zinc-400">Day 2 (Sanding):</span>
                                    <span className="font-semibold text-amber-400">{formatReadableDate(eventDate2)}</span>
                                  </div>
                                )}
                                {eventLocation2 && (
                                  <div className="text-[11px] text-zinc-400 truncate">Location: {eventLocation2}</div>
                                )}
                              </div>
                            )}
                          </>
                        ) : (
                          (eventDate || eventLocation) && (
                            <div>
                              {eventDate && (
                                <div className="flex justify-between">
                                  <span className="text-zinc-400">Event Date:</span>
                                  <span className="font-semibold text-white">{formatReadableDate(eventDate)}</span>
                                </div>
                              )}
                              {eventLocation && (
                                <div className="text-[11px] text-zinc-400 truncate">Location: {eventLocation}</div>
                              )}
                            </div>
                          )
                        )}
                      </div>
                    )}
                  </div>

                  {/* Price Items List */}
                  <div className="p-5 sm:p-6 space-y-4">
                    <div className="space-y-3">
                      <div className="flex items-start justify-between gap-3 pb-3 border-b border-zinc-800/70">
                        <div>
                          <span className="text-xs uppercase tracking-wider text-amber-400 font-semibold block">
                            Selected Package
                          </span>
                          <h4 className="text-sm font-bold text-white mt-0.5">
                            {calculation.basePkg.name}
                          </h4>
                          <p className="text-xs text-zinc-400">
                            {calculation.basePkg.duration}
                          </p>
                        </div>
                        <span className="text-sm font-bold text-white shrink-0">
                          RM {formatRM(calculation.basePrice)}
                        </span>
                      </div>

                      {calculation.addonsList.length > 0 && (
                        <div className="space-y-2 pb-3 border-b border-zinc-800/70">
                          <span className="text-xs uppercase tracking-wider text-sky-400 font-semibold block">
                            Add-On Package
                          </span>
                          {calculation.addonsList.map((item) => (
                            <div key={item.id} className="flex items-start justify-between gap-3 text-xs sm:text-sm">
                              <span className="text-zinc-300">{item.name}</span>
                              <span className="font-semibold text-white shrink-0">
                                RM {formatRM(item.price)}
                              </span>
                            </div>
                          ))}
                        </div>
                      )}

                      {calculation.overtimeHours > 0 && (
                        <div className="flex items-center justify-between gap-3 pb-3 border-b border-zinc-800/70 text-xs sm:text-sm">
                          <div>
                            <span className="text-zinc-300 block">Add-on Hours (Extra Hours)</span>
                            <span className="text-xs text-zinc-500">
                              {calculation.overtimeHours} Hours x RM {calculation.overtimeRate}
                            </span>
                          </div>
                          <span className="font-semibold text-white">
                            RM {formatRM(calculation.overtimeTotal)}
                          </span>
                        </div>
                      )}

                      <div className="flex items-center justify-between gap-3 pb-3 border-b border-zinc-800/70 text-xs sm:text-sm">
                        <div>
                          <span className="text-zinc-300 block">Transportation Fees</span>
                          <span className="text-xs text-teal-400 font-medium block">
                            {calculation.locationUnitRate === 0
                              ? calculation.locationObj.name
                              : calculation.tripDays === 1
                              ? `${calculation.locationObj.name} (1 Day Trip)`
                              : `${calculation.locationObj.name} (2 Day Trip)`}
                          </span>
                          <span className="text-[11px] text-zinc-500 block">
                            {calculation.locationObj.desc}
                            {calculation.locationDiscount > 0 && (
                              <span className="text-emerald-400 font-semibold ml-1">
                                (Normal RM{calculation.locationUnitRate * calculation.tripDays} - RM10 Discount)
                              </span>
                            )}
                          </span>
                        </div>
                        <span className="font-semibold text-white shrink-0">
                          RM {formatRM(calculation.locationCharge)}
                        </span>
                      </div>
                    </div>

                    {/* Grand Total */}
                    <div className="p-4 rounded-xl bg-gradient-to-r from-amber-500/20 via-amber-500/10 to-zinc-950 border border-amber-500/40 flex items-center justify-between">
                      <div>
                        <span className="text-xs uppercase tracking-wider font-bold text-amber-400 block">
                          TOTAL INVESTMENT
                        </span>
                        <span className="text-[11px] text-zinc-400">
                          Net Package Price
                        </span>
                      </div>
                      <span className="text-2xl sm:text-3xl font-extrabold text-amber-400">
                        RM {formatRM(calculation.grandTotal)}
                      </span>
                    </div>

                    {/* Action Buttons */}
                    <div className="pt-2 space-y-2.5">
                      <button
                        type="button"
                        onClick={handleCheckAvailability}
                        className="w-full py-3.5 px-4 rounded-xl bg-amber-500 hover:bg-amber-400 active:scale-[0.99] text-zinc-950 font-bold text-sm flex items-center justify-center gap-2 transition-all shadow-lg shadow-amber-500/20"
                      >
                        <IconCalendar className="w-4 h-4" />
                        <span>Check Date Availability</span>
                      </button>

                      {availabilityResult && (
                        <div className={`p-4 rounded-xl border text-xs space-y-3 ${
                          availabilityResult.status === 'available'
                            ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-200'
                            : availabilityResult.status === 'booked'
                            ? 'bg-red-500/10 border-red-500/30 text-red-300'
                            : 'bg-amber-500/10 border-amber-500/30 text-amber-300'
                        }`}>
                          <p className="font-bold text-sm leading-relaxed">{availabilityResult.message}</p>

                          {availabilityResult.status === 'available' && (
                            <div className="space-y-3 pt-2 border-t border-emerald-500/20">
                              <div>
                                <label className="block text-xs font-semibold text-emerald-200 mb-1.5">
                                  Client Name*
                                </label>
                                <input
                                  type="text"
                                  placeholder="e.g., Nurul Izzati"
                                  value={clientName}
                                  onChange={(e) => {
                                    setClientName(e.target.value);
                                    if (clientFormError) setClientFormError('');
                                  }}
                                  className="w-full bg-zinc-950/90 border border-emerald-500/30 rounded-xl px-3.5 py-3 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-emerald-400"
                                />
                              </div>

                              <div>
                                <label className="block text-xs font-semibold text-emerald-200 mb-1.5">
                                  Phone Number (WhatsApp)*
                                </label>
                                <input
                                  type="tel"
                                  placeholder="e.g., 012-3456789"
                                  value={clientPhone}
                                  onChange={(e) => {
                                    setClientPhone(e.target.value);
                                    if (clientFormError) setClientFormError('');
                                  }}
                                  className="w-full bg-zinc-950/90 border border-emerald-500/30 rounded-xl px-3.5 py-3 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-emerald-400"
                                />
                              </div>

                              <div>
                                <label className="block text-xs font-semibold text-emerald-200 mb-1.5">
                                  Instagram Account <span className="text-emerald-300/70 font-normal">(for tagging purpose)</span>
                                </label>
                                <input
                                  type="text"
                                  placeholder="e.g., @nurulizzati"
                                  value={clientInstagram}
                                  onChange={(e) => setClientInstagram(e.target.value)}
                                  className="w-full bg-zinc-950/90 border border-emerald-500/30 rounded-xl px-3.5 py-3 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-emerald-400"
                                />
                              </div>

                              {/* TERMA & SYARAT PERKHIDMATAN (ASAL) */}
                              <div className="p-3.5 rounded-xl bg-zinc-950/95 border border-emerald-500/30 space-y-2.5">
                                <div className="flex items-center justify-between border-b border-zinc-800 pb-2">
                                  <h4 className="text-[11px] uppercase tracking-wider font-extrabold text-amber-400">
                                    TERMA & SYARAT PERKHIDMATAN
                                  </h4>
                                  <span className="text-[10px] text-zinc-400">(Scroll untuk baca)</span>
                                </div>

                                <div className="max-h-56 overflow-y-auto pr-1.5 space-y-3 text-[11px] text-zinc-300 leading-relaxed">
                                  <div>
                                    <p className="font-bold text-white mb-1">1. TEMPAHAN DAN BAYARAN</p>
                                    <ul className="space-y-1 pl-3 list-disc">
                                      <li><span className="font-semibold text-zinc-100">Deposit Tempahan:</span> Bayaran deposit tetap sebanyak RM200 diperlukan untuk mengesahkan slot tarikh. Slot tidak dianggap sah sehingga deposit diterima.</li>
                                      <li><span className="font-semibold text-zinc-100">Status Deposit:</span> Semua bayaran deposit adalah tidak akan dipulangkan (non-refundable) jika berlaku pembatalan daripada pihak pelanggan.</li>
                                      <li><span className="font-semibold text-zinc-100">Baki Bayaran:</span> Baki penuh bayaran pakej mestilah dijelaskan selewat-lewatnya tujuh (7) hari sebelum tarikh majlis berlangsung.</li>
                                      <li><span className="font-semibold text-zinc-100">Kegagalan Bayaran:</span> Firdaus Shah (FS Pictures) berhak membatalkan tempahan serta-merta tanpa pemulangan deposit sekiranya baki bayaran gagal diselesaikan dalam tempoh yang ditetapkan.</li>
                                    </ul>
                                  </div>

                                  <div>
                                    <p className="font-bold text-white mb-1">2. PENJADUALAN SEMULA & PERUBAHAN BUTIRAN</p>
                                    <ul className="space-y-1 pl-3 list-disc">
                                      <li><span className="font-semibold text-zinc-100">Notis Penjadualan:</span> Sebarang permohonan pertukaran tarikh mestilah dimaklumkan sekurang-kurangnya 30 hari sebelum tarikh asal. Pertukaran bergantung kepada kekosongan slot dan hanya dibenarkan satu (1) kali sahaja.</li>
                                      <li><span className="font-semibold text-zinc-100">Perubahan Butiran:</span> Sebarang perubahan lokasi, masa, atau pakej mestilah dimaklumkan dalam masa yang mencukupi. Perubahan saat akhir (kurang 14 hari) mungkin dikenakan caj tambahan bergantung kepada logistik.</li>
                                    </ul>
                                  </div>

                                  <div>
                                    <p className="font-bold text-white mb-1">3. KELEWATAN DAN TEMPOH PENGGAMBARAN</p>
                                    <ul className="space-y-1 pl-3 list-disc">
                                      <li><span className="font-semibold text-zinc-100">Masa Sesi:</span> Sesi penggambaran bermula dan tamat mengikut waktu yang telah dipersetujui dalam pakej.</li>
                                      <li><span className="font-semibold text-zinc-100">Kelewatan Pelanggan:</span> Jika majlis/pelanggan lewat melebihi 30 minit, Firdaus Shah (FS Pictures) berhak mengurangkan masa penggambaran atau menamatkan sesi mengikut waktu asal yang dijadualkan.</li>
                                      <li><span className="font-semibold text-zinc-100">Caj Masa Tambahan (OT):</span> Sekiranya pelanggan memohon untuk menambah masa penggambaran di lokasi, caj tambahan sebanyak RM99 sejam akan dikenakan (tertakluk kepada ketersediaan).</li>
                                    </ul>
                                  </div>

                                  <div>
                                    <p className="font-bold text-white mb-1">4. TANGGUNGJAWAB PELANGGAN</p>
                                    <ul className="space-y-1 pl-3 list-disc">
                                      <li><span className="font-semibold text-zinc-100">Kerjasama:</span> Pelanggan bertanggungjawab memastikan tetamu dan ahli keluarga memberikan kerjasama serta akses ruang yang diperlukan untuk tujuan fotografi.</li>
                                      <li><span className="font-semibold text-zinc-100">Kebenaran Lokasi:</span> Pelanggan bertanggungjawab mendapatkan kebenaran atau permit penggambaran di lokasi-lokasi tertentu (jika perlu).</li>
                                      <li><span className="font-semibold text-zinc-100">Keselamatan Peralatan:</span> Pelanggan bertanggungjawab atas sebarang kerosakan atau kehilangan peralatan Firdaus Shah (FS Pictures) yang disebabkan oleh kecuaian pihak pelanggan atau tetamu semasa majlis. Kos ganti rugi akan ditanggung sepenuhnya oleh pelanggan.</li>
                                    </ul>
                                  </div>

                                  <div>
                                    <p className="font-bold text-white mb-1">5. PENGHANTARAN HASIL KERJA (DELIVERABLES)</p>
                                    <ul className="space-y-1 pl-3 list-disc">
                                      <li><span className="font-semibold text-zinc-100">Gambar Suntingan (Edit):</span> Gambar yang telah disunting sepenuhnya akan diserahkan dalam tempoh 4 hingga 8 minggu selepas tarikh majlis.</li>
                                      <li><span className="font-semibold text-zinc-100">Gambar Mentah (Raw):</span> Gambar mentah (tanpa edit) boleh diberikan dalam tempoh 2 minggu selepas majlis (atas permintaan).</li>
                                      <li><span className="font-semibold text-zinc-100">Album Foto:</span> Jika termasuk dalam pakej, album akan siap dalam tempoh 8 hingga 16 minggu selepas pelanggan selesai membuat pemilihan gambar.</li>
                                      <li><span className="font-semibold text-zinc-100">Mod Penghantaran:</span> Hasil kerja akan dihantar melalui Google Drive / Pendrive / Album mengikut pakej yang ditempah.</li>
                                    </ul>
                                  </div>

                                  <div>
                                    <p className="font-bold text-white mb-1">6. HAK CIPTA DAN PENGGUNAAN</p>
                                    <ul className="space-y-1 pl-3 list-disc">
                                      <li>Firdaus Shah (FS Pictures) memegang hak cipta ke atas semua karya. Pihak kami berhak menggunakan gambar/video bagi tujuan pemasaran, portfolio, dan promosi di media sosial kecuali jika pelanggan menyatakan bantahan secara bertulis semasa tempahan dibuat.</li>
                                    </ul>
                                  </div>

                                  <div>
                                    <p className="font-bold text-white mb-1">7. PEMBATALAN & FORCE MAJEURE</p>
                                    <ul className="space-y-1 pl-3 list-disc">
                                      <li><span className="font-semibold text-zinc-100">Pembatalan oleh Firdaus Shah (FS Pictures):</span> Jika berlaku kecemasan yang tidak dapat dielakkan (sakit kronik, kemalangan, atau kerosakan peralatan utama), Firdaus Shah (FS Pictures) akan memberikan notis dan memulangkan bayaran penuh kepada pelanggan.</li>
                                      <li><span className="font-semibold text-zinc-100">Force Majeure:</span> Firdaus Shah (FS Pictures) tidak bertanggungjawab atas kegagalan perkhidmatan akibat bencana alam, gangguan trafik luar biasa, atau isu teknikal di luar kawalan manusia.</li>
                                    </ul>
                                  </div>
                                </div>

                                <label className="pt-2.5 border-t border-zinc-800 flex items-start gap-2.5 cursor-pointer select-none">
                                  <input
                                    type="checkbox"
                                    checked={agreedToTnC}
                                    onChange={(e) => {
                                      setAgreedToTnC(e.target.checked);
                                      if (clientFormError) setClientFormError('');
                                    }}
                                    className="mt-0.5 w-4 h-4 rounded border-zinc-600 text-emerald-500 focus:ring-emerald-500 bg-zinc-900 shrink-0 cursor-pointer"
                                  />
                                  <span className="text-[11px] font-medium text-emerald-200 leading-snug">
                                    Saya telah membaca dan bersetuju dengan semua <span className="underline font-bold">Terma & Syarat Perkhidmatan</span> di atas.
                                  </span>
                                </label>
                              </div>

                              {clientFormError && (
                                <p className="text-xs text-amber-300 font-semibold">
                                  {clientFormError}
                                </p>
                              )}

                              <button
                                type="button"
                                onClick={handleDirectWhatsApp}
                                className={`w-full py-3.5 px-4 rounded-xl font-extrabold text-sm flex items-center justify-center gap-2 transition-all ${
                                  agreedToTnC
                                    ? 'bg-emerald-500 hover:bg-emerald-400 active:scale-[0.99] text-zinc-950 shadow-lg shadow-emerald-500/20'
                                    : 'bg-zinc-800 text-zinc-400 cursor-not-allowed'
                                }`}
                              >
                                <IconWhatsApp className="w-4 h-4" />
                                <span>Proceed to Book via WhatsApp</span>
                              </button>
                            </div>
                          )}
                        </div>
                      )}
                    </div>

                    {/* Brand Footer */}
                    <div className="pt-3 border-t border-zinc-800/60 flex items-center justify-between text-[11px] text-zinc-500">
                      <span>IG / Threads: @firdaus.shah27</span>
                      <span>FS Pictures</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </main>

          {/* STICKY BOTTOM BAR KHAS UNTUK TELEFON PINTAR (MOBILE) */}
          <div className="fixed bottom-0 inset-x-0 z-40 lg:hidden bg-zinc-950/95 backdrop-blur-lg border-t border-zinc-800 px-4 py-3 shadow-[0_-10px_30px_rgba(0,0,0,0.7)]">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-3">
              <div onClick={scrollToSummary} className="cursor-pointer min-w-0">
                <span className="text-[10px] uppercase tracking-wider font-bold text-zinc-400 block">
                  Total Investment
                </span>
                <div className="flex items-baseline gap-1.5">
                  <span className="text-xl font-extrabold text-amber-400">
                    RM {formatRM(calculation.grandTotal)}
                  </span>
                  <span className="text-[11px] text-zinc-400 truncate max-w-[110px]">
                    • {calculation.basePkg.name}
                  </span>
                </div>
              </div>

              <button
                type="button"
                onClick={scrollToSummary}
                className="px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 active:scale-95 text-zinc-950 font-extrabold text-xs flex items-center gap-1.5 shadow-lg shadow-amber-500/20 shrink-0"
              >
                <IconCalendar className="w-3.5 h-3.5" />
                <span>View & Check Date</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
